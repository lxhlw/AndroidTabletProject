name: L101 Volume Float APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取项目
      - name: Checkout source
        uses: actions/checkout@v7

      # 2. 先安装 JDK 17
      # setup-android / sdkmanager 需要 JDK 17+
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check JDK 17
        run: java -version

      # 3. 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. 安装项目需要的 Android SDK
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;28.0.3"

      # 5. 切换回 JDK 8
      # 老项目 Gradle 4.10.3 / AGP 3.2.1 使用 JDK 8
      - name: Switch to JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Check JDK 8
        run: java -version

      # 6. 使用项目自带 Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      # 7. 编译 APK
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 8. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L101VolumeFloat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
