name: L101 Volume Float APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;28.0.3"

      - name: Switch to JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL -o /tmp/gradle-4.10.3-bin.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q /tmp/gradle-4.10.3-bin.zip -d /tmp
          echo "/tmp/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          if ! echo "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "ERROR: Release tag must look like v0.20.0"
            exit 1
          fi
          VERSION_CODE=$((1000000 + $(date -u +%s) / 60))
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set debug version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "APP_VERSION_NAME=dev" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=1" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.L101_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: L101_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p release-keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore/l101-volume-release.jks
          test -s release-keystore/l101-volume-release.jks

      - name: Build signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore/l101-volume-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.L101_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.L101_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.L101_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk ./L101VolumeFloat.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ./L101VolumeFloat.apk
          fi
          ls -lh ./L101VolumeFloat.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: L101VolumeFloat-apk
          path: L101VolumeFloat.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./L101VolumeFloat.apk --clobber
          else
            gh release create "$RELEASE_TAG" ./L101VolumeFloat.apk --title "L101 Volume Float $RELEASE_TAG" --generate-notes
          fi

      - name: Clean signing files
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f release-keystore/l101-volume-release.jks
