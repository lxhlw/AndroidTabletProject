name: L101 Volume Float APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取项目
      - name: Checkout source
        uses: actions/checkout@v7

      # 2. 先安装 JDK 17
      # setup-android / sdkmanager 需要 JDK 17+
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check JDK 17
        run: java -version

      # 3. 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. 安装项目需要的 Android SDK
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;28.0.3"

      # 5. 切换回 JDK 8
      # 老项目 Gradle 4.10.3 / AGP 3.2.1 使用 JDK 8
      - name: Switch to JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Check JDK 8
        run: java -version

      # 6. 下载并准备官方 Gradle 4.10.3
      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL -o /tmp/gradle-4.10.3-bin.zip             https://services.gradle.org/distributions/gradle-4.10.3-bin.zip

          unzip -q /tmp/gradle-4.10.3-bin.zip -d /tmp

          echo "/tmp/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      # 7. 检查 Gradle
      - name: Check Gradle
        run: |
          java -version
          gradle --version

      # 8. 编译 APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      # 9. 复制成固定文件名，便于 Release 直接提供下载
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./L101VolumeFloat.apk
          ls -lh ./L101VolumeFloat.apk

      # 10. 继续保留 Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: L101VolumeFloat-debug-apk
          path: L101VolumeFloat.apk

      # 11. 只有推送 v* 标签时，自动创建 GitHub Release
      # 例如：v0.19.0
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Replacing APK asset..."
            gh release upload "$RELEASE_TAG"               ./L101VolumeFloat.apk               --clobber
          else
            echo "Creating Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG"               ./L101VolumeFloat.apk               --title "L101 Volume Float $RELEASE_TAG"               --generate-notes
          fi
