name: L101 Volume Float APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;28.0.3"

      - name: Switch to JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL -o /tmp/gradle-4.10.3-bin.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q /tmp/gradle-4.10.3-bin.zip -d /tmp
          echo "/tmp/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          if ! echo "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "ERROR: Release tag must look like v0.20.0"
            exit 1
          fi
          VERSION_CODE=$((1000000 + $(date -u +%s) / 60))
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set debug version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "APP_VERSION_NAME=dev" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=1" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.L101_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: L101_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p release-keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore/l101-volume-release.jks
          test -s release-keystore/l101-volume-release.jks

      - name: Build signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore/l101-volume-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.L101_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.L101_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.L101_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk ./L101VolumeFloat.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ./L101VolumeFloat.apk
          fi
          ls -lh ./L101VolumeFloat.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: L101VolumeFloat-apk
          path: L101VolumeFloat.apk

      - name: Generate APK release information
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          AAPT="$ANDROID_HOME/build-tools/28.0.3/aapt"
          BADGING="$($AAPT dump badging L101VolumeFloat.apk)"

          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.* versionName='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.* versionCode='\\([^']*\\)'.*/\\1/p")"
          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\\([^']*\\)'.*/\\1/p")"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\\([^']*\\)'.*/\\1/p")"
          NATIVE_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^native-code: //p")"

          APK_SIZE_BYTES="$(stat -c%s L101VolumeFloat.apk)"
          APK_SIZE="$(du -h L101VolumeFloat.apk | cut -f1)"
          SHA256="$(sha256sum L101VolumeFloat.apk | awk '{print $1}')"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if [ -z "$NATIVE_CODE" ]; then
            NATIVE_CODE="armeabi-v7a"
          fi

          cat > release-notes.md <<EOF
          ## L101 Volume Float $VERSION_NAME

          ### APK

          | Item | Value |
          | --- | --- |
          | File | `L101VolumeFloat.apk` |
          | Version | `$VERSION_NAME` |
          | Version Code | `$VERSION_CODE` |
          | Package | `$PACKAGE_NAME` |
          | Minimum Android | API `$MIN_SDK` |
          | Target Android | API `$TARGET_SDK` |
          | CPU ABI | `$NATIVE_CODE` |
          | File Size | `$APK_SIZE` ($APK_SIZE_BYTES bytes) |
          | SHA-256 | `$SHA256` |
          | Build Time | `$BUILD_DATE` |

          ### Download

          **[Download L101VolumeFloat.apk](https://github.com/lxhlw/AndroidTabletProject/releases/download/${{ github.ref_name }}/L101VolumeFloat.apk)**

          This APK is automatically built and signed by GitHub Actions for the tagged release.

          ### Installation / Upgrade

          **First installation:** install the APK normally on the Android 4.4.2 device. If an older copy signed with a different certificate is already installed, uninstall the old copy first.

          **Later upgrades:** releases use the same signing key, so newer versions can be installed over the existing app without uninstalling it.

          **ADB installation:**
          ```bat
          adb install -r L101VolumeFloat.apk
          ```

          **Package name:** `com.l101.volumefloat`
          EOF

          cat release-notes.md

      - name: Generate GitHub changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            > generated-release-notes.json

          jq -r '.body // ""' generated-release-notes.json > generated-changelog.md

          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "## What's Changed"
            echo
            cat generated-changelog.md
          } > final-release-notes.md

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./L101VolumeFloat.apk --clobber
            gh release edit "$RELEASE_TAG" --notes-file final-release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              ./L101VolumeFloat.apk \
              --title "L101 Volume Float $RELEASE_TAG" \
              --notes-file final-release-notes.md
          fi

      - name: Clean signing files
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f release-keystore/l101-volume-release.jks
