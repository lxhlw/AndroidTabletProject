name: Deploy WhyMusic to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout L101 repository
        uses: actions/checkout@v6

      - name: Checkout WhyMusic
        uses: actions/checkout@v6
        with:
          repository: whypuss/whymusic
          path: whymusic-source
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        working-directory: whymusic-source
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Patch WhyMusic worker fallbacks
        working-directory: whymusic-source
        run: node ../scripts/patch-whymusic-worker.mjs

      - name: Patch LX Music compatibility layer
        working-directory: whymusic-source
        run: node ../scripts/patch-lx-compat.mjs

      - name: Install WhyMusic dependencies
        working-directory: whymusic-source
        run: pnpm install --frozen-lockfile

      - name: Build WhyMusic for Cloudflare Pages
        working-directory: whymusic-source
        run: pnpm build:cf

      - name: Install L101 official WhyMusic plugin
        working-directory: whymusic-source
        run: |
          test -s ../plugins/whymusic.js
          mkdir -p packages/web/dist/plugins
          cp ../plugins/whymusic.js packages/web/dist/plugins/whymusic.js
          test -s packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin copied to packages/web/dist/plugins/whymusic.js"

      - name: Verify pre-bundled Worker and plugin
        working-directory: whymusic-source
        run: |
          test -s packages/web/dist/_worker.js
          echo "✓ Pre-bundled Worker exists: packages/web/dist/_worker.js"
          if grep -q 'from "node:stream"\|from '\''node:stream'\''\|require("node:stream")\|require('\''node:stream'\'')' packages/web/dist/_worker.js; then
            echo "✘ Unexpected external node:stream import remains in _worker.js"
            exit 1
          fi
          echo "✓ No external node:stream import remains"
          grep -q 'module.exports' packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin is valid CommonJS"
          grep -q 'searchWhyMusicNetease' packages/web/dist/_worker.js
          echo "✓ Search fallback is included in Worker bundle"
          grep -q 'getNeteaseOuterUrl' packages/web/dist/_worker.js
          echo "✓ Netease media URL fallback is included in Worker bundle"
          grep -q 'recommendWhyMusicNetease' packages/web/dist/_worker.js
          echo "✓ Netease recommendation fallback is included in Worker bundle"

      - name: Deploy WhyMusic
        working-directory: whymusic-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to existing Cloudflare Pages project: whymusic-l101"
          pnpm dlx wrangler@latest pages deploy packages/web/dist \
            --project-name=whymusic-l101 \
            --branch=main \
            --commit-dirty=true \
            --no-bundle

      - name: Smoke test production site
        env:
          BASE_URL: https://whymusic-l101.pages.dev
        run: |
          set -euo pipefail

          echo "Waiting for production deployment..."
          for i in {1..12}; do
            if curl -fsS --max-time 10 "$BASE_URL/" -o /tmp/whymusic-home.html; then
              echo "✓ Homepage reachable"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "✘ Homepage did not become reachable"
              exit 1
            fi
            sleep 5
          done

          plugin="$(curl -fsS --max-time 15 "$BASE_URL/plugins/whymusic.js")"
          printf '%s\n' "$plugin" | grep -q 'module.exports'
          printf '%s\n' "$plugin" | grep -q "name: 'WhyMusic'"
          echo "✓ Production official plugin is reachable and valid"

          version="$(curl -fsS --max-time 15 "$BASE_URL/api/version")"
          echo "$version" | jq -e '.worker' >/dev/null
          echo "✓ /api/version responds: $version"

          search="$(curl -fsS --max-time 30 --get "$BASE_URL/api/why-search" \
            --data-urlencode 'q=周杰伦' \
            --data-urlencode 'type=music' \
            --data-urlencode 'page=1' \
            --data-urlencode 'count=1')"
          echo "$search" | jq -e '.data | type == "array" and length >= 1' >/dev/null
          echo "✓ /api/why-search returns at least one result"

          first="$(echo "$search" | jq -c '.data[0]')"
          test "$first" != "null"
          song_id="$(echo "$first" | jq -r '.id')"
          song_title="$(echo "$first" | jq -r '.title')"
          song_artist="$(echo "$first" | jq -r '.artist')"
          song_source="$(echo "$first" | jq -r '.subSource // ""')"

          media="$(curl -fsS --max-time 45 --get "$BASE_URL/api/why-url" \
            --data-urlencode "id=$song_id" \
            --data-urlencode "title=$song_title" \
            --data-urlencode "artist=$song_artist" \
            --data-urlencode "source=$song_source" \
            --data-urlencode 'br=320')"
          echo "$media" | jq -e '.url | type == "string" and length > 0' >/dev/null
          echo "✓ /api/why-url returns a playable URL"
          media_url="$(echo "$media" | jq -r '.url')"
          rm -f /tmp/whymusic-audio.bin
          curl -fsSL -L --max-time 45 -r 0-4095 "$media_url" -o /tmp/whymusic-audio.bin
          test -s /tmp/whymusic-audio.bin
          size="$(wc -c < /tmp/whymusic-audio.bin)"
          test "$size" -ge 100
          echo "✓ Resolved media URL returned audio bytes (${size} bytes sample)"
          lyric_id="$(echo "$first" | jq -r '.lyricId // .id')"
          lyric_source="$(echo "$first" | jq -r '.subSource // "netease"')"
          lyric="$(curl -fsS --max-time 30 --get "$BASE_URL/api/why-lyric" \
            --data-urlencode "id=$lyric_id" \
            --data-urlencode "source=$lyric_source")"
          echo "$lyric" | jq -e 'type == "object" and has("lyric") and has("tlyric")' >/dev/null
          echo "✓ /api/why-lyric responds with lyric payload"

          recommend_response="$(curl -sS --max-time 45 --get -w '\nHTTP_STATUS:%{http_code}' "$BASE_URL/api/recommend" \
            --data-urlencode 'cat=cantonese' \
            --data-urlencode 'limit=5' \
            --data-urlencode 'seed=1')"
          recommend_status="$(printf '%s\n' "$recommend_response" | sed -n 's/^HTTP_STATUS://p')"
          recommend="$(printf '%s\n' "$recommend_response" | sed '/^HTTP_STATUS:/d')"
          echo "Recommendation HTTP status: $recommend_status"
          echo "Recommendation response:"
          echo "$recommend"
          test "$recommend_status" = "200"
          echo "$recommend" | jq -e '.data | type == "array"' >/dev/null
          echo "✓ /api/recommend returns a data array"

          echo "LX platform smoke tests..."
          lx_failures=0
          for platform in netease qq kugou kuwo migu; do
            lx_body_file="/tmp/lx-${platform}.json"
            lx_status="$(curl -sS --max-time 30 --get -o "$lx_body_file" -w '%{http_code}' "$BASE_URL/api/lx-search" \
              --data-urlencode "source=$platform" \
              --data-urlencode 'q=周杰伦' \
              --data-urlencode 'page=1' \
              --data-urlencode 'count=3')"
            lx_body="$(cat "$lx_body_file")"
            echo "$platform HTTP $lx_status -> $lx_body"
            if [ "$lx_status" = "200" ] && echo "$lx_body" | jq -e '.data | type == "array" and length >= 1' >/dev/null; then
              echo "✓ LX direct search works: $platform"
            else
              echo "✘ LX direct search failed: $platform"
              lx_failures=$((lx_failures + 1))
            fi
          done
          test "$lx_failures" -eq 0

          # 公开 LX 多平台音源样本：验证安装器识别的是 LX 协议源码，而不是只允许
          # module.exports 的 WhyMusic 原生插件。
          sample_code="$(curl -fsSL --max-time 30 \
            'https://raw.githubusercontent.com/cdyUuu/lx-music-xinghai-source/main/xinghai-music-source.js')"
          printf '%s' "$sample_code" | grep -q 'globalThis.lx'
          printf '%s' "$sample_code" | grep -q 'EVENT_NAMES.inited'
          printf '%s' "$sample_code" | grep -q "'wy'"
          printf '%s' "$sample_code" | grep -q "'tx'"
          printf '%s' "$sample_code" | grep -q "'kg'"
          printf '%s' "$sample_code" | grep -q "'kw'"
          printf '%s' "$sample_code" | grep -q "'mg'"
          echo "✓ Real LX multi-platform source sample declares wy/tx/kg/kw/mg"
          echo "Running real LX source compatibility smoke test..."
          node ../scripts/test-lx-compat.mjs
