name: Deploy WhyMusic to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout L101 repository
        uses: actions/checkout@v6

      - name: Checkout WhyMusic
        uses: actions/checkout@v6
        with:
          repository: whypuss/whymusic
          path: whymusic-source
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        working-directory: whymusic-source
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Patch search fallback
        working-directory: whymusic-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/web/worker/why.js")
          text = path.read_text()

          marker = "async function searchWhyMusic(keyword, page = 1, count = 20) {"
          fallback = r'''
          /** GD 全部失败时的搜索兜底：直接走网易云公开搜索接口。 */
          async function searchWhyMusicNetease(keyword, page = 1, count = 20) {
            const offset = (Math.max(1, Number(page) || 1) - 1) * count
            const data = await neteaseFetch(
              '/api/search/get?s=' + encodeURIComponent(keyword)
              + '&type=1&limit=' + count + '&offset=' + offset,
            )
            const songs = (data && data.result && data.result.songs) || []
            return songs.map(gdTrackToItem).filter(Boolean)
          }

          '''

          if "async function searchWhyMusicNetease(" not in text:
              if marker not in text:
                  raise SystemExit("searchWhyMusic marker not found")
              text = text.replace(marker, fallback + marker, 1)

          old = r'''  if (settled.every(r => r.status === 'rejected')) {
            throw new Error(
              `所有子音源都失败：${settled.map((r, i) => `${WHY_SOURCES[i]}（${r.reason?.message}）`).join('；')}`,
            )
          }
          '''

          new = r'''  if (settled.every(r => r.status === 'rejected')) {
            // GD 暂时不可用时，至少保留一个可工作的搜索入口。
            // 网易云搜索结果沿用现有 MusicItem 结构；播放时仍走 /api/why-url。
            try {
              const fallback = await searchWhyMusicNetease(keyword, page, count)
              if (fallback.length > 0) return fallback
            } catch (err) {
              console.error('[why] netease fallback search failed:', err?.message)
            }

            throw new Error(
              `所有子音源都失败：${settled.map((r, i) => `${WHY_SOURCES[i]}（${r.reason?.message}）`).join('；')}`,
            )
          }
          '''

          if old not in text:
              raise SystemExit("search failure block not found")

          text = text.replace(old, new, 1)
          path.write_text(text)
          print("✓ Search fallback patched")
          PY

      - name: Install WhyMusic dependencies
        working-directory: whymusic-source
        run: pnpm install --frozen-lockfile

      - name: Build WhyMusic for Cloudflare Pages
        working-directory: whymusic-source
        run: pnpm build:cf

      - name: Install L101 official WhyMusic plugin
        working-directory: whymusic-source
        run: |
          test -s ../plugins/whymusic.js
          mkdir -p packages/web/dist/plugins
          cp ../plugins/whymusic.js packages/web/dist/plugins/whymusic.js
          test -s packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin copied to packages/web/dist/plugins/whymusic.js"

      - name: Verify pre-bundled Worker and plugin
        working-directory: whymusic-source
        run: |
          test -s packages/web/dist/_worker.js
          echo "✓ Pre-bundled Worker exists: packages/web/dist/_worker.js"
          if grep -q 'from "node:stream"\|from '\''node:stream'\''\|require("node:stream")\|require('\''node:stream'\'')' packages/web/dist/_worker.js; then
            echo "✘ Unexpected external node:stream import remains in _worker.js"
            exit 1
          fi
          echo "✓ No external node:stream import remains"
          grep -q 'module.exports' packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin is valid CommonJS"
          grep -q 'searchWhyMusicNetease' packages/web/dist/_worker.js
          echo "✓ Search fallback is included in Worker bundle"

      - name: Deploy WhyMusic
        working-directory: whymusic-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to existing Cloudflare Pages project: whymusic-l101"
          pnpm dlx wrangler@latest pages deploy packages/web/dist \
            --project-name=whymusic-l101 \
            --branch=main \
            --commit-dirty=true \
            --no-bundle

      - name: Smoke test production site
        env:
          BASE_URL: https://whymusic-l101.pages.dev
        run: |
          set -euo pipefail

          echo "Waiting for production deployment..."
          for i in {1..12}; do
            if curl -fsS --max-time 10 "$BASE_URL/" -o /tmp/whymusic-home.html; then
              echo "✓ Homepage reachable"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "✘ Homepage did not become reachable"
              exit 1
            fi
            sleep 5
          done

          plugin="$(curl -fsS --max-time 15 "$BASE_URL/plugins/whymusic.js")"
          printf '%s\n' "$plugin" | grep -q 'module.exports'
          printf '%s\n' "$plugin" | grep -q "name: 'WhyMusic'"
          echo "✓ Production official plugin is reachable and valid"

          version="$(curl -fsS --max-time 15 "$BASE_URL/api/version")"
          echo "$version" | jq -e '.worker' >/dev/null
          echo "✓ /api/version responds: $version"

          search="$(curl -fsS --max-time 30 --get "$BASE_URL/api/why-search" \
            --data-urlencode 'q=周杰伦' \
            --data-urlencode 'type=music' \
            --data-urlencode 'page=1' \
            --data-urlencode 'count=1')"
          echo "$search" | jq -e '.data | type == "array" and length >= 1' >/dev/null
          echo "✓ /api/why-search returns at least one result"
