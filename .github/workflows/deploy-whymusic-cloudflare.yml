name: Deploy WhyMusic to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout L101 repository
        uses: actions/checkout@v6

      - name: Checkout WhyMusic
        uses: actions/checkout@v6
        with:
          repository: whypuss/whymusic
          path: whymusic-source
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        working-directory: whymusic-source
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Patch search fallback
        working-directory: whymusic-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/web/worker/why.js")
          text = path.read_text()
          # GD 解析失败时，网易云歌曲直接使用官方 outer media URL 作为播放兜底。
          # 该地址是稳定的 HTTPS 入口，不依赖 GD 的 url 解析服务。
          media_marker = "async function getWhySubSourceUrl(songId, source, bitrate = GD_BITRATE) {"
          if "function getNeteaseOuterUrl" not in text:
              helper = '''
          function getNeteaseOuterUrl(songId) {
            if (!songId) return ''
            return 'https://music.163.com/song/media/outer/url?id=' + encodeURIComponent(songId) + '.mp3'
          }

          '''
              text = text.replace(media_marker, helper + media_marker, 1)

          old_media = '''async function getWhySubSourceUrl(songId, source, bitrate = GD_BITRATE) {
            if (source === AUDIOMACK_SOURCE) return await getAudiomackMedia(songId)
            return await getGdUrl(songId, source, bitrate)
          }'''
          new_media = '''async function getWhySubSourceUrl(songId, source, bitrate = GD_BITRATE) {
            if (source === AUDIOMACK_SOURCE) return await getAudiomackMedia(songId)
            try {
              const url = await getGdUrl(songId, source, bitrate)
              if (url) return url
            } catch (err) {
              console.error('[why] GD url failed ' + source + '/' + songId + ': ' + (err?.message || err))
            }
            if (source === 'netease') return getNeteaseOuterUrl(songId)
            return ''
          }'''
          if old_media not in text:
              raise SystemExit("getWhySubSourceUrl block not found")
          text = text.replace(old_media, new_media, 1)

          fallback = r'''
          /** GD 全部失败时的搜索兜底：直接走网易云公开搜索接口。 */
          async function searchWhyMusicNetease(keyword, page = 1, count = 20) {
            const offset = (Math.max(1, Number(page) || 1) - 1) * count
            const data = await neteaseFetch(
              '/api/search/get?s=' + encodeURIComponent(keyword)
              + '&type=1&limit=' + count + '&offset=' + offset,
            )
            const songs = (data && data.result && data.result.songs) || []
            return songs.map(gdTrackToItem).filter(Boolean)
          }

          '''

          if "async function searchWhyMusicNetease(" not in text:
              text = text.replace(
                  "async function searchWhyMusic(keyword, page = 1, count = 20) {",
                  fallback + "async function searchWhyMusic(keyword, page = 1, count = 20) {",
                  1,
              )

          pattern = re.compile(
              r"async function searchWhyMusic\(keyword, page = 1, count = 20\) \{.*?\n\}\n\nasync function getGdUrl\(",
              re.S,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit("searchWhyMusic function not found")

          replacement = r'''async function searchWhyMusic(keyword, page = 1, count = 20) {
            const settled = await Promise.allSettled(
              WHY_SOURCES.map(source => searchWhySubSource(source, keyword, page, count)),
            )
            const buckets = settled.map((r, i) => {
              if (r.status === 'fulfilled') return r.value
              console.error(`[why] search failed on ${WHY_SOURCES[i]}: ${r.reason?.message}`)
              return []
            })

            if (settled.every(r => r.status === 'rejected')) {
              try {
                const fallback = await searchWhyMusicNetease(keyword, page, count)
                if (fallback.length > 0) return fallback
              } catch (err) {
                console.error('[why] netease fallback search failed:', err?.message)
              }

              throw new Error(
                `所有子音源都失败：${settled.map((r, i) => `${WHY_SOURCES[i]}（${r.reason?.message}）`).join('；')}`,
              )
            }

            const seen = new Set()
            const merged = []
            const maxLen = Math.max(0, ...buckets.map(b => b.length))
            for (let idx = 0; idx < maxLen; idx++) {
              for (const bucket of buckets) {
                const item = bucket[idx]
                if (!item || !item.id || !item.title) continue
                const key = `${gdNormalizeName(item.title)}::${gdNormalizeName(item.artist)}`
                if (seen.has(key)) continue
                seen.add(key)
                merged.push(item)
              }
            }
            return merged
          }

          async function getGdUrl('''

          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text)
          print("✓ Search fallback patched by function replacement")
          PY

      - name: Install WhyMusic dependencies
        working-directory: whymusic-source
        run: pnpm install --frozen-lockfile

      - name: Build WhyMusic for Cloudflare Pages
        working-directory: whymusic-source
        run: pnpm build:cf

      - name: Install L101 official WhyMusic plugin
        working-directory: whymusic-source
        run: |
          test -s ../plugins/whymusic.js
          mkdir -p packages/web/dist/plugins
          cp ../plugins/whymusic.js packages/web/dist/plugins/whymusic.js
          test -s packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin copied to packages/web/dist/plugins/whymusic.js"

      - name: Verify pre-bundled Worker and plugin
        working-directory: whymusic-source
        run: |
          test -s packages/web/dist/_worker.js
          echo "✓ Pre-bundled Worker exists: packages/web/dist/_worker.js"
          if grep -q 'from "node:stream"\|from '\''node:stream'\''\|require("node:stream")\|require('\''node:stream'\'')' packages/web/dist/_worker.js; then
            echo "✘ Unexpected external node:stream import remains in _worker.js"
            exit 1
          fi
          echo "✓ No external node:stream import remains"
          grep -q 'module.exports' packages/web/dist/plugins/whymusic.js
          echo "✓ Official plugin is valid CommonJS"
          grep -q 'searchWhyMusicNetease' packages/web/dist/_worker.js
          echo "✓ Search fallback is included in Worker bundle"
          grep -q 'getNeteaseOuterUrl' packages/web/dist/_worker.js
          echo "✓ Netease media URL fallback is included in Worker bundle"

      - name: Deploy WhyMusic
        working-directory: whymusic-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to existing Cloudflare Pages project: whymusic-l101"
          pnpm dlx wrangler@latest pages deploy packages/web/dist \
            --project-name=whymusic-l101 \
            --branch=main \
            --commit-dirty=true \
            --no-bundle

      - name: Smoke test production site
        env:
          BASE_URL: https://whymusic-l101.pages.dev
        run: |
          set -euo pipefail

          echo "Waiting for production deployment..."
          for i in {1..12}; do
            if curl -fsS --max-time 10 "$BASE_URL/" -o /tmp/whymusic-home.html; then
              echo "✓ Homepage reachable"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "✘ Homepage did not become reachable"
              exit 1
            fi
            sleep 5
          done

          plugin="$(curl -fsS --max-time 15 "$BASE_URL/plugins/whymusic.js")"
          printf '%s\n' "$plugin" | grep -q 'module.exports'
          printf '%s\n' "$plugin" | grep -q "name: 'WhyMusic'"
          echo "✓ Production official plugin is reachable and valid"

          version="$(curl -fsS --max-time 15 "$BASE_URL/api/version")"
          echo "$version" | jq -e '.worker' >/dev/null
          echo "✓ /api/version responds: $version"

          search="$(curl -fsS --max-time 30 --get "$BASE_URL/api/why-search" \
            --data-urlencode 'q=周杰伦' \
            --data-urlencode 'type=music' \
            --data-urlencode 'page=1' \
            --data-urlencode 'count=1')"
          echo "$search" | jq -e '.data | type == "array" and length >= 1' >/dev/null
          echo "✓ /api/why-search returns at least one result"

          first="$(echo "$search" | jq -c '.data[0]')"
          test "$first" != "null"
          song_id="$(echo "$first" | jq -r '.id')"
          song_title="$(echo "$first" | jq -r '.title')"
          song_artist="$(echo "$first" | jq -r '.artist')"
          song_source="$(echo "$first" | jq -r '.subSource // ""')"

          media="$(curl -fsS --max-time 45 --get "$BASE_URL/api/why-url" \
            --data-urlencode "id=$song_id" \
            --data-urlencode "title=$song_title" \
            --data-urlencode "artist=$song_artist" \
            --data-urlencode "source=$song_source" \
            --data-urlencode 'br=320')"
          echo "$media" | jq -e '.url | type == "string" and length > 0' >/dev/null
          echo "✓ /api/why-url returns a playable URL"
